<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid slice" role="img"><defs>
    <linearGradient id="bga33" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E6E2D8"/>
      <stop offset="1" stop-color="#D2CBBB"/>
    </linearGradient>
    <!-- Soft light from above. A centred radial highlight read as a visible
         white blob on flat product backgrounds, so the key light is a vertical
         wash and the only radial term is a wide, very soft corner vignette.
         A dark card inverts the lighting so the backdrop recedes. -->
    <linearGradient id="keya33" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="viga33" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#1C1917" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1917" stop-opacity="0.09"/>
    </radialGradient>
    <linearGradient id="faba33" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#8A7C6C"/>
      <stop offset="0.55" stop-color="#7A6C5C"/>
      <stop offset="1" stop-color="#7A6C5C"/>
    </linearGradient>
    <!-- Figures live in a 300-wide local space, so they need their own gradient
         keyed to the figure clip id rather than the 800-wide product one. -->
    <linearGradient id="figFIG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8A7C6C"/>
      <stop offset="0.6" stop-color="#7A6C5C"/>
      <stop offset="1" stop-color="#7A6C5C"/>
    </linearGradient>
    <filter id="graina33" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs><g id="art"><rect width="480" height="480" fill="url(#bga33)"/>
  <rect width="480" height="480" fill="url(#keya33)"/>
  <g transform="translate(240 246) scale(0.44) translate(-400 -520)">
    <ellipse cx="400" cy="786" rx="150" ry="18" fill="#1C1917" opacity="0.16"/>
    <path fill="none" stroke="#7A6C5C" stroke-width="15" stroke-linecap="round" d="M302 418c0-70 44-114 98-114s98 44 98 114"/>
    <path fill="#7A6C5C" d="M240 404h320c16 0 28 12 28 28v292c0 32-26 58-58 58H270c-32 0-58-26-58-58V432c0-16 12-28 28-28z"/>
    <path fill="#8A7C6C" opacity="0.38" d="M240 404h320c16 0 28 12 28 28v52H212v-52c0-16 12-28 28-28z"/>
    <path fill="#8A7C6C" d="M212 476h376v30H212z"/>
    <path fill="none" stroke="#7A6C5C" stroke-width="3" opacity="0.28" d="M212 506h376"/>
    <rect x="352" y="546" width="96" height="64" rx="10" fill="#8A7C6C" opacity="0.85"/>
    <path fill="none" stroke="#7A6C5C" stroke-width="3" opacity="0.25" d="M262 660h276"/>
    <g fill="#8A7C6C" opacity="0.65"><circle cx="230" cy="491" r="5"/><circle cx="570" cy="491" r="5"/></g></g>
  <rect width="480" height="480" fill="url(#viga33)"/>
  <rect width="480" height="480" filter="url(#graina33)" opacity="0.05"/></g></svg>