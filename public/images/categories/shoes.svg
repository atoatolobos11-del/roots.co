<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid slice" role="img"><defs>
    <linearGradient id="bga32" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E9E6E0"/>
      <stop offset="1" stop-color="#D7D3CA"/>
    </linearGradient>
    <!-- Soft light from above. A centred radial highlight read as a visible
         white blob on flat product backgrounds, so the key light is a vertical
         wash and the only radial term is a wide, very soft corner vignette.
         A dark card inverts the lighting so the backdrop recedes. -->
    <linearGradient id="keya32" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="viga32" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#111111" stop-opacity="0"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0.09"/>
    </radialGradient>
    <linearGradient id="faba32" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#D5CEBF"/>
      <stop offset="0.55" stop-color="#C9C2B4"/>
      <stop offset="1" stop-color="#C9C2B4"/>
    </linearGradient>
    <!-- Figures live in a 300-wide local space, so they need their own gradient
         keyed to the figure clip id rather than the 800-wide product one. -->
    <linearGradient id="figFIG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#D5CEBF"/>
      <stop offset="0.6" stop-color="#C9C2B4"/>
      <stop offset="1" stop-color="#C9C2B4"/>
    </linearGradient>
    <filter id="graina32" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs><g id="art"><rect width="480" height="480" fill="url(#bga32)"/>
  <rect width="480" height="480" fill="url(#keya32)"/>
  <g transform="translate(240 246) scale(0.44) translate(-400 -520)">
    <ellipse cx="420" cy="712" rx="224" ry="20" fill="#111111" opacity="0.16"/>
    <path fill="#C9C2B4" d="M206 592c0-56 26-98 72-120 30-14 62-18 96-14 24 3 44 12 60 28l30 32c24 26 58 44 100 54 40 10 66 28 72 52 4 18-8 34-32 42-32 11-76 16-134 16H242c-22 0-36-12-36-30z"/>
    <path fill="#D5CEBF" d="M190 640c0-8 6-14 16-14h412c14 0 22 8 20 18-4 18-26 30-62 30H232c-26 0-42-12-42-34z"/>
    <path fill="#C9C2B4" d="M300 500c24-14 52-20 82-18l-14 66c-26-4-52-16-74-32z"/>
    <ellipse cx="354" cy="508" rx="36" ry="13" fill="#D5CEBF" opacity="0.5"/>
    <path fill="none" stroke="#D5CEBF" stroke-width="9" stroke-linecap="round" opacity="0.9" d="M334 550h92"/>
    <path fill="#C9C2B4" d="M596 564c30 6 52 16 66 30 10 10 12 20 6 30-8 12-28 18-60 18-14 0-22-6-22-18 0-22 4-42 10-60z"/>
    <path fill="none" stroke="#D5CEBF" stroke-width="3" opacity="0.4" d="M258 678h296"/></g>
  <rect width="480" height="480" fill="url(#viga32)"/>
  <rect width="480" height="480" filter="url(#graina32)" opacity="0.05"/></g></svg>