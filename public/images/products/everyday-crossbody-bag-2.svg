<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="img"><defs>
    <linearGradient id="bga20" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#D5CFC2"/>
      <stop offset="1" stop-color="#C0B8A8"/>
    </linearGradient>
    <!-- Soft light from above. A centred radial highlight read as a visible
         white blob on flat product backgrounds, so the key light is a vertical
         wash and the only radial term is a wide, very soft corner vignette.
         A dark card inverts the lighting so the backdrop recedes. -->
    <linearGradient id="keya20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="viga20" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#1C1917" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1917" stop-opacity="0.09"/>
    </radialGradient>
    <linearGradient id="faba20" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3D3630"/>
      <stop offset="0.55" stop-color="#2B2622"/>
      <stop offset="1" stop-color="#2B2622"/>
    </linearGradient>
    <!-- Figures live in a 300-wide local space, so they need their own gradient
         keyed to the figure clip id rather than the 800-wide product one. -->
    <linearGradient id="figFIG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3D3630"/>
      <stop offset="0.6" stop-color="#2B2622"/>
      <stop offset="1" stop-color="#2B2622"/>
    </linearGradient>
    <filter id="graina20" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs><g id="art"><rect width="800" height="1000" fill="url(#bga20)"/>
  <rect width="800" height="1000" fill="url(#keya20)"/>
  
    <ellipse cx="400" cy="768" rx="130" ry="16" fill="#1C1917" opacity="0.16"/>
    <path fill="none" stroke="#2B2622" stroke-width="13" stroke-linecap="round" d="M240 336c62-42 204-54 312-24"/>
    <path fill="#2B2622" d="M272 428h256c13 0 23 10 23 23v214c0 27-21 48-48 48H297c-27 0-48-21-48-48V451c0-13 10-23 23-23z"/>
    <path fill="#3D3630" opacity="0.38" d="M272 428h256c13 0 23 10 23 23v50H249v-50c0-13 10-23 23-23z"/>
    <path fill="#3D3630" d="M249 494h302v26H249z"/>
    <path fill="none" stroke="#2B2622" stroke-width="3" opacity="0.28" d="M249 520h302"/>
    <rect x="370" y="550" width="62" height="42" rx="8" fill="#3D3630" opacity="0.85"/>
    <g fill="#3D3630" opacity="0.65"><circle cx="264" cy="507" r="4.5"/><circle cx="536" cy="507" r="4.5"/></g>
  <rect width="800" height="1000" fill="url(#viga20)"/>
  <rect width="800" height="1000" filter="url(#graina20)" opacity="0.05"/></g></svg>