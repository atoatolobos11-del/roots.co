<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="img"><defs>
    <linearGradient id="bga25" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#D5CFC2"/>
      <stop offset="1" stop-color="#C0B8A8"/>
    </linearGradient>
    <!-- Soft light from above. A centred radial highlight read as a visible
         white blob on flat product backgrounds, so the key light is a vertical
         wash and the only radial term is a wide, very soft corner vignette.
         A dark card inverts the lighting so the backdrop recedes. -->
    <linearGradient id="keya25" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="viga25" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#1C1917" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1917" stop-opacity="0.09"/>
