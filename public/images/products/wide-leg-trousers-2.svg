      <stop offset="0" stop-color="#4B453D"/>
      <stop offset="0.55" stop-color="#3B3630"/>
      <stop offset="1" stop-color="#3B3630"/>
    </linearGradient>
    <!-- Figures live in a 300-wide local space, so they need their own gradient
         keyed to the figure clip id rather than the 800-wide product one. -->
    <linearGradient id="figFIG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4B453D"/>
      <stop offset="0.6" stop-color="#3B3630"/>
      <stop offset="1" stop-color="#3B3630"/>
    </linearGradient>
    <filter id="graina16" x="0" y="0" width="100%" height="100%">
