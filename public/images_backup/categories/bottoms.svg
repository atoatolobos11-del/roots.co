<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid slice" role="img"><defs>
    <linearGradient id="bga30" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#E4DFD3"/>
    </linearGradient>
    <!-- Soft light from above. A centred radial highlight read as a visible
         white blob on flat product backgrounds, so the key light is a vertical
         wash and the only radial term is a wide, very soft corner vignette.
         A dark card inverts the lighting so the backdrop recedes. -->
    <linearGradient id="keya30" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="viga30" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#1C1917" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1917" stop-opacity="0.09"/>
    </radialGradient>
    <linearGradient id="faba30" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#5A534A"/>
      <stop offset="0.55" stop-color="#4A443C"/>
      <stop offset="1" stop-color="#4A443C"/>
    </linearGradient>
    <!-- Figures live in a 300-wide local space, so they need their own gradient
         keyed to the figure clip id rather than the 800-wide product one. -->
    <linearGradient id="figFIG" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5A534A"/>
      <stop offset="0.6" stop-color="#4A443C"/>
      <stop offset="1" stop-color="#4A443C"/>
    </linearGradient>
    <filter id="graina30" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs><g id="art"><rect width="480" height="480" fill="url(#bga30)"/>
  <rect width="480" height="480" fill="url(#keya30)"/>
