name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint --deny-warnings src scripts

      - name: Audit for dead buttons and links
        run: npm run audit:links

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Account dialog a11y and validation
        run: npm run test:account

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:account:flow
          npm run test:interactions

      - name: Verify the production URL is stamped
        # index.html, robots.txt and sitemap.xml must all agree on the host,
        # otherwise search engines index a placeholder domain. Run
        # `npm run set:url -- <your-url>` to fix.
        run: node scripts/check-site-url.mjs --strict

      - name: Upload the production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
